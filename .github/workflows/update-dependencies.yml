name: Dependency Update

on:
  schedule:
    # Weekly dependency check on Sundays at 6 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [hmt-apigateway, hmt-email-service]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOT_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Update dependencies for ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: |
          # Check for outdated packages
          npm outdated > outdated.txt || true
          
          if [ -s outdated.txt ]; then
            echo "Outdated packages found:"
            cat outdated.txt
            
            # Update patch and minor versions
            npm update
            
            # Check for major version updates
            npx npm-check-updates -u --target minor
            npm install
            
            # Run tests to ensure everything still works
            npm test
          else
            echo "All packages are up to date"
          fi

      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.BOT_TOKEN }}
          commit-message: 'chore: update dependencies for ${{ matrix.service }}'
          title: 'chore: update dependencies for ${{ matrix.service }}'
          body: |
            Automated dependency update for ${{ matrix.service }}
            
            This PR updates patch and minor versions of dependencies.
            
            Please review the changes and ensure all tests pass before merging.
          branch: dependency-update/${{ matrix.service }}
          delete-branch: true

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '❌ Dependency update failed for ${{ matrix.service }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
