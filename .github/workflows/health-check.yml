name: Health Check

on:
  schedule:
    # Run health check every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Health check for ${{ matrix.environment }}
        run: |
          if [ "${{ matrix.environment }}" = "staging" ]; then
            HOST="${{ secrets.STAGING_HOST }}"
            USER="${{ secrets.STAGING_USER }}"
            SSH_KEY="${{ secrets.STAGING_SSH_KEY }}"
          else
            HOST="${{ secrets.PRODUCTION_HOST }}"
            USER="${{ secrets.PRODUCTION_USER }}"
            SSH_KEY="${{ secrets.PRODUCTION_SSH_KEY }}"
          fi
          
          # Setup SSH
          echo "$SSH_KEY" > ssh_key
          chmod 600 ssh_key
          
          # Run health check
          ssh -i ssh_key -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            cd /opt/hmt-deployment
            ./scripts/health-check.sh > health_check.log 2>&1
            exit_code=$?
            cat health_check.log
            exit $exit_code
          EOF

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '🚨 Health check failed for ${{ matrix.environment }} environment!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
