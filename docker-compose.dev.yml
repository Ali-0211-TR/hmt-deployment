version: '3.8'

networks:
  hmt-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: hmt-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hmt_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - hmt-dev-network

  redis:
    image: redis:7-alpine
    container_name: hmt-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - hmt-dev-network

  api-gateway:
    build:
      context: ./services/hmt-apigateway
      dockerfile: Dockerfile
      target: development
    container_name: hmt-api-gateway-dev
    ports:
      - "3000:3000"
      - "9229:9229" # Debug port
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:password@postgres:5432/hmt_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EMAIL_SERVICE_URL: email-service:5000
    volumes:
      - ./services/hmt-apigateway:/app
      - /app/node_modules
    networks:
      - hmt-dev-network
    depends_on:
      - postgres
      - redis
    command: npm run start:dev

  email-service:
    build:
      context: ./services/hmt-email-service
      dockerfile: Dockerfile
      target: development
    container_name: hmt-email-service-dev
    ports:
      - "5000:5000"
      - "9230:9229" # Debug port
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:password@postgres:5432/hmt_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 5000
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      - ./services/hmt-email-service:/app
      - /app/node_modules
    networks:
      - hmt-dev-network
    depends_on:
      - postgres
      - redis
    command: npm run start:dev
